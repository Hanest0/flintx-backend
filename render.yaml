services:
  - type: web
    name: flintx-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn flint.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./flintx.db
      - key: SECRET_KEY
        value: 9ed3de12b47d0313abdb3294196ad838b008b3e6c2bf9440ba801e8a323ec1f2
      - key: FRONTEND_URL
        value: https://vdm-technology.vercel.app
      - key: PORT
        value: "10000"
    plan: free
